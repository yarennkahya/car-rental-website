<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - CarRental</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <span class="brand-icon">🚗</span>Car<span class="brand-accent">Rental</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Ana Sayfa</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#hakkimizda">Hakkımızda</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#iletisim">İletişim</a></li>
                </ul>

                <div class="navbar-auth">
                    <a href="login.html" class="auth-link">Giriş Yap</a>
                    <a href="register.html" class="auth-button-nav">Üye Ol</a>
                </div>
            </div>
        </div>
    </nav>

    <main>
        <section>
            <div class="auth-container">
                <h2>Giriş Yap</h2>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="login-email" class="form-label">E-posta</label>
                        <input type="email" class="form-control" id="login-email" required>
                    </div>
                    <div class="mb-3">
                        <label for="login-password" class="form-label">Şifre</label>
                        <input type="password" class="form-control" id="login-password" required>
                    </div>
                    <button type="submit" class="btn auth-button w-100">Giriş Yap</button>
                </form>
                <p class="auth-switch">Hesabın yok mu? <a href="register.html">Üye ol</a></p>
            </div>
        </section>
    </main>

    <footer class="section-alt">
        <p>&copy; 2026 CarRental. Tüm hakları saklıdır.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
